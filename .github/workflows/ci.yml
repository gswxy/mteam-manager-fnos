name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: 运行测试（模拟 M-Team 与 fnOS 下载中心）
        working-directory: backend
        run: python -m pytest tests/ -v
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/tests/.test-data
          if-no-files-found: ignore

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装与构建
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: 产物校验
        run: test -f frontend/dist/index.html && echo "frontend dist OK"

  fpk-build-check:
    name: FPK 构建检查（x86）
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建 FPK
        run: bash scripts/build_fpk.sh x86
      - name: 校验产物结构
        run: |
          FPK=$(ls dist-fpk/*.fpk)
          test -f "$FPK" && test -f dist-fpk/*.sha256
          tar -tzf "$FPK" | grep -q '^manifest$'
          tar -tzf "$FPK" | grep -q 'app/runtime/bin/python3'
          tar -tzf "$FPK" | grep -q 'app/ui/config'
          tar -tzf "$FPK" | grep -q 'cmd/main'
          echo "FPK structure OK: $FPK ($(du -h "$FPK" | cut -f1))"
      - uses: actions/upload-artifact@v4
        with:
          name: fpk-x86-ci
          path: dist-fpk/*.fpk
          retention-days: 7
